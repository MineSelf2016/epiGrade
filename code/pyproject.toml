[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epigrade"
version = "1.0.0"
description = "Surface-protein imputation from single-cell transcriptomes, with a per-protein estimate of which proteins it can support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["CITE-seq", "single-cell", "protein imputation", "reference mapping"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "faiss-cpu>=1.8",
  "h5py>=3.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
plot = ["matplotlib>=3.8"]

[project.urls]
Source = "https://github.com/MineSelf2016/epiGrade"

[tool.setuptools]
packages = ["epigrade"]
